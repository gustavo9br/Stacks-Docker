services:
  waha:
    image: devlikeapro/waha:chrome
    environment:
      PORT: "3000"
      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_DASHBOARD_USERNAME: "${WAHA_USERNAME}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_PASSWORD}"
      WHATSAPP_SWAGGER_USERNAME: "${WAHA_USERNAME}"
      WHATSAPP_SWAGGER_PASSWORD: "${WAHA_PASSWORD}"
      WHATSAPP_DEFAULT_ENGINE: "WEBJS"
      WAHA_WEBJS_PUPPETER_ARGS: "--disable-dev-shm-usage"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - externa
    healthcheck:                   # /ping é público, não exige WAHA_API_KEY
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [ node.role == manager ]
      restart_policy:
        condition: any
        delay: 5s
        window: 30s
      resources:
        limits:
          cpus: "2"
          memory: 3072M        # WEBJS roda Chromium — precisa de mais RAM que o GOWS
        reservations:
          memory: 512M
      update_config:
        parallelism: 1
        order: start-first
        failure_action: pause
      labels:
        traefik.enable: "true"
        traefik.docker.network: "externa"
        traefik.http.routers.waha.rule: "Host(`${SUBDOMAIN}.${DOMAIN}`)"
        traefik.http.routers.waha.entrypoints: "web"
        traefik.http.services.waha.loadbalancer.server.port: "3000"

networks:
  externa:
    external: true

volumes:
  waha_sessions:
    external: true
